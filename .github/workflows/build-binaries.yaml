name: Build packaged binaries

on: [push, pull_request, create]

# GITHUB_TOKEN needs write access to attach binaries to a GitHub Release
# (electron-builder's --publish, added below).
permissions:
  contents: write

env:
  # electron-builder only actually uploads/publishes when this is "always" -
  # gated to real tag pushes (v2.3.0, etc.) so ordinary branch/PR builds
  # never attempt to touch Releases (and PR builds from forks wouldn't have
  # write-scoped GITHUB_TOKEN access to do so anyway).
  PUBLISH_POLICY: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && 'always' || 'never' }}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Cache node modules
      uses: actions/cache@v4
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Cache Electron binaries
      uses: actions/cache@v4
      env:
        cache-name: cache-electron-bins
      with:
        # cache location is described here:
        # https://github.com/electron/get#how-it-works
        path: ~/.cache/electron
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Install system dependencies for x64->x32 cross-build
      run: |
        sudo apt update
        sudo apt install libc6-dev-i386 gcc-multilib g++-multilib
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 14
    - name: Setup npm
      run: npm i -g npm@7
    - name: Patch bundled node-gyp for modern Python
      run: |
        GYP_INPUT="$(npm root -g)/npm/node_modules/node-gyp/gyp/pylib/gyp/input.py"
        sed -i "s/open(build_file_path, ['\"]rU['\"])/open(build_file_path, 'r')/" "$GYP_INPUT"
        grep -n "open(build_file_path" "$GYP_INPUT"
    - name: Install build deps
      run: npm install
    - name: Run prebuild script
      run: npm run prebuild-linux
    - name: Build for x64 / ia32
      run: |
        echo "::warning::DIAG PUBLISH_POLICY='${{ env.PUBLISH_POLICY }}' ref='${{ github.ref }}' event='${{ github.event_name }}'"
        set +e
        ./node_modules/.bin/electron-builder build -l --x64 --ia32 --publish ${{ env.PUBLISH_POLICY }} 2>&1 | tee /tmp/build.log
        echo "::warning::DIAG electron-builder exit code was ${PIPESTATUS[0]}"
        grep -iE "publish|upload|skip|github|401|403|token|auth" /tmp/build.log | sed 's/^/::warning::DIAG /' || echo "::warning::DIAG no matching lines found in build log"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/upload-artifact@v4
      with:
        name: Linux-AppImages
        path: dist/*.AppImage
        if-no-files-found: error

  build-linux-arm32:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup QEMU
      uses: docker/setup-qemu-action@v1
      with:
        platforms: arm
    - name: Cache node modules
      uses: actions/cache@v4
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Cache Electron binaries
      uses: actions/cache@v4
      env:
        cache-name: cache-electron-bins
      with:
        # cache location is described here:
        # https://github.com/electron/get#how-it-works
        path: ~/.cache/electron
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Run prebuild outside of QEMU emulator
      run: sudo npm i -g npm@7 && npm install && rsync -a --info=progress2 src/ prebuild-src --exclude node_modules && node prebuild-minify.js && rm -rf node_modules
    - name: Build for arm32v7 (aka armv7l)
      uses: docker://arm32v7/node:14-buster
      with:
        args: bash -c "npm i -g npm@7 && npm config set fetch-retries 5 && npm config set fetch-retry-mintimeout 20000 && npm config set fetch-timeout 600000 && for i in 1 2 3; do npm install && break; echo 'npm install failed (attempt '$i'), retrying...'; sleep 15; done && for i in 1 2 3; do ./node_modules/.bin/electron-builder build -l --armv7l --publish ${{ env.PUBLISH_POLICY }} && break; echo 'build failed (attempt '$i'), retrying...'; sleep 15; done"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/upload-artifact@v4
      with:
        name: Linux-arm32-AppImage
        path: dist/*.AppImage
        if-no-files-found: error

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup QEMU
      uses: docker/setup-qemu-action@v1
      with:
        platforms: arm64
    - name: Cache node modules
      uses: actions/cache@v4
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Cache Electron binaries
      uses: actions/cache@v4
      env:
        cache-name: cache-electron-bins
      with:
        # cache location is described here:
        # https://github.com/electron/get#how-it-works
        path: ~/.cache/electron
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Run prebuild outside of QEMU emulator
      run: sudo npm i -g npm@7 && npm install && rsync -a --info=progress2 src/ prebuild-src --exclude node_modules && node prebuild-minify.js && rm -rf node_modules
    - name: Build for arm64 (aka arm64v8)
      uses: docker://arm64v8/node:14-buster
      with:
        args: bash -c "npm i -g npm@7 && npm config set fetch-retries 5 && npm config set fetch-retry-mintimeout 20000 && npm config set fetch-timeout 600000 && for i in 1 2 3; do npm install && break; echo 'npm install failed (attempt '$i'), retrying...'; sleep 15; done && for i in 1 2 3; do ./node_modules/.bin/electron-builder build -l --arm64 --publish ${{ env.PUBLISH_POLICY }} && break; echo 'build failed (attempt '$i'), retrying...'; sleep 15; done"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/upload-artifact@v4
      with:
        name: Linux-arm64-AppImage
        path: dist/*.AppImage
        if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - name: Get npm cache directory
      id: npm-cache
      shell: bash
      run: |
        echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: ${{ steps.npm-cache.outputs.dir }}
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
    - name: Cache Electron binaries
      uses: actions/cache@v4
      env:
        cache-name: cache-electron-bins
      with:
        # cache location is described here:
        # https://github.com/electron/get#how-it-works
        path: ~/AppData/Local/electron/Cache
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 14
    - name: Setup npm
      run: npm i -g npm@7
    - name: Work around missing openssl_fips gyp var in old Electron headers
      shell: bash
      run: npm config set openssl_fips "" --global
    - name: Setup Python build deps
      shell: bash
      run: python -m pip install setuptools
    - name: Replace bundled node-gyp (VS2022 detection bug)
      shell: bash
      run: |
        NPM_GYP_DIR="$(npm root -g)/npm/node_modules/node-gyp"
        mkdir -p "$RUNNER_TEMP/gyp-replacement"
        cd "$RUNNER_TEMP/gyp-replacement"
        npm init -y --silent
        npm install node-gyp@9 --silent
        # npm hoists node-gyp's own deps up to the top-level node_modules
        # instead of nesting them under node_modules/node-gyp - merge them
        # back in so the copied folder is fully self-contained.
        cd node_modules
        for d in */; do
          d="${d%/}"
          [ "$d" = "node-gyp" ] && continue
          mkdir -p "node-gyp/node_modules"
          cp -r "$d" "node-gyp/node_modules/"
        done
        rm -rf "$NPM_GYP_DIR"
        cp -r node-gyp "$NPM_GYP_DIR"
        node "$NPM_GYP_DIR/bin/node-gyp.js" --version
    - name: npm install
      shell: bash
      run: |
        for i in 1 2 3; do
          npm install && break
          echo "npm install failed (attempt $i), retrying..."
          sleep 10
        done
    - name: npm build
      run: npm run build-windows -- --publish ${{ env.PUBLISH_POLICY }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/upload-artifact@v4
      with:
        name: Windows-Installer
        path: dist/*.exe
        if-no-files-found: error

  build-darwin:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Cache node modules
      uses: actions/cache@v4
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Cache Electron binaries
      uses: actions/cache@v4
      env:
        cache-name: cache-electron-bins
      with:
        # cache location is described here:
        # https://github.com/electron/get#how-it-works
        path: ~/Library/Caches/electron
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
    - name: Setup npm
      run: sudo npm i -g npm@7 && sudo chown -R $(id -u):$(id -g) ~/.npm
    - name: Work around missing openssl_fips gyp var in old Electron headers
      run: npm config set openssl_fips "" --global
    - name: Setup Python build deps
      run: pip3 install --break-system-packages setuptools
    - name: Replace bundled node-gyp (old gyp bugs on modern Python/Electron headers)
      run: |
        NPM_GYP_DIR="$(sudo npm root -g)/npm/node_modules/node-gyp"
        mkdir -p /tmp/gyp-replacement
        cd /tmp/gyp-replacement
        npm init -y --silent
        npm install node-gyp@9 --silent
        cd node_modules
        for d in */; do
          d="${d%/}"
          [ "$d" = "node-gyp" ] && continue
          mkdir -p "node-gyp/node_modules"
          cp -r "$d" "node-gyp/node_modules/"
        done
        sudo rm -rf "$NPM_GYP_DIR"
        sudo cp -r node-gyp "$NPM_GYP_DIR"
        node "$NPM_GYP_DIR/bin/node-gyp.js" --version
    - name: npm install
      run: npm install
    - name: Disable Spotlight indexing (mitigates flaky "hdiutil ... Resource busy" dmg failures)
      run: sudo mdutil -a -i off
    - name: npm build
      run: |
        for i in 1 2 3; do
          npm run build-darwin -- --publish ${{ env.PUBLISH_POLICY }} && break
          echo "build failed (attempt $i), retrying..."
          sleep 15
        done
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/upload-artifact@v4
      with:
        name: MacOS-Image
        path: dist/*.dmg
        if-no-files-found: error
