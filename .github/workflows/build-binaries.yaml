name: Build packaged binaries

on:
  push:
  pull_request:
  create:
  # Fires exactly once when a Release is published (draft->public, or a
  # brand-new release created straight as public) - see the PUBLISH_POLICY
  # comment below for why this is the trigger that actually matters here.
  release:
    types: [published]
  # Lets a maintainer manually re-run a publish build against a specific
  # tag from the Actions UI/API - e.g. to backfill binaries for a release
  # that didn't get them (see docs/06-build-and-deployment.md 6.5).
  workflow_dispatch:

# GITHUB_TOKEN needs write access to attach binaries to a GitHub Release
# (electron-builder's --publish, added below).
permissions:
  contents: write

env:
  # electron-builder only actually uploads/publishes when this is "always".
  #
  # Only `release` (published) and manual `workflow_dispatch` set it -
  # deliberately NOT a `push` of a `refs/tags/v*` ref. That was the
  # original design (see git history), but v2.3.1 shipped with zero
  # binaries attached because of it: publishing a *new* release through
  # GitHub's UI creates the underlying tag at the moment you click
  # Publish, and that tag creation fires a `push` event alongside the
  # `release` event, ~simultaneously. Both would set PUBLISH_POLICY to
  # "always" under the old push-based rule, so two full build matrices
  # would race to attach assets to the same release - electron-builder's
  # GitHub publisher isn't built to have two independent processes
  # uploading to the same release concurrently, and the failure mode is
  # silent (jobs report success, nothing ends up attached). `release` is
  # the one GitHub event actually designed for "a release was published,
  # go build/attach binaries for it" and fires exactly once regardless of
  # whether the tag was pre-existing or created by the publish action, so
  # it alone is authoritative here. A bare `git push` of a version tag
  # with no accompanying Release (e.g. from a local clone, publishing
  # workflow) still runs the build for CI-validation purposes, it just
  # won't auto-publish - use workflow_dispatch (or draft-then-publish a
  # Release the normal way) for that instead.
  PUBLISH_POLICY: ${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && 'always' || 'never' }}

  # Every build/publish invocation below also passes explicit -c.publish.*
  # CLI overrides (provider=github, releaseType=release) in addition to
  # package.json's build.publish config. Belt-and-suspenders: electron-
  # builder has had long-standing, still-reproducing-in-23.x bugs where a
  # persistent releaseType config doesn't reliably reach the actual publish
  # decision (electron-userland/electron-builder#2393, #8179 - "existing
  # type not compatible with publishing type existingType=release
  # publishingType=draft", silently skips every asset, exits 0 regardless).
  # CLI-level overrides sidestep that.
  #
  # NOTE: draft/prerelease are deliberately NOT in this list, even though
  # earlier attempts included them - electron-builder 23.6.0's GithubOptions
  # schema doesn't have those fields at all (only releaseType), so passing
  # them makes the whole publish config fail AJV validation before the
  # build even starts (every job green->red, zero dist output, caught via
  # the actual build-linux-arm64 log). See docs/06-build-and-deployment.md
  # 6.5.1 for the full v2.3.1 postmortem, including this and the separate
  # `npm run <script> -- <extra args>` argument-mangling issue that hit the
  # Windows/macOS jobs specifically (fixed by invoking electron-builder
  # directly instead of through an npm script, matching how the Linux jobs
  # already did it).

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Cache node modules
      uses: actions/cache@v4
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Cache Electron binaries
      uses: actions/cache@v4
      env:
        cache-name: cache-electron-bins
      with:
        # cache location is described here:
        # https://github.com/electron/get#how-it-works
        path: ~/.cache/electron
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Install system dependencies for x64->x32 cross-build
      run: |
        sudo apt update
        sudo apt install libc6-dev-i386 gcc-multilib g++-multilib
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 14
    - name: Setup npm
      run: npm i -g npm@7
    - name: Patch bundled node-gyp for modern Python
      run: |
        GYP_INPUT="$(npm root -g)/npm/node_modules/node-gyp/gyp/pylib/gyp/input.py"
        sed -i "s/open(build_file_path, ['\"]rU['\"])/open(build_file_path, 'r')/" "$GYP_INPUT"
        grep -n "open(build_file_path" "$GYP_INPUT"
    - name: Install build deps
      run: npm install
    - name: Run prebuild script
      run: npm run prebuild-linux
    - name: Build for x64 / ia32
      run: ./node_modules/.bin/electron-builder build -l --x64 --ia32 --publish ${{ env.PUBLISH_POLICY }} -c.publish.provider=github -c.publish.releaseType=release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/upload-artifact@v4
      with:
        name: Linux-AppImages
        path: dist/*.AppImage
        if-no-files-found: error

  build-linux-arm32:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup QEMU
      uses: docker/setup-qemu-action@v1
      with:
        platforms: arm
    - name: Cache node modules
      uses: actions/cache@v4
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Cache Electron binaries
      uses: actions/cache@v4
      env:
        cache-name: cache-electron-bins
      with:
        # cache location is described here:
        # https://github.com/electron/get#how-it-works
        path: ~/.cache/electron
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Run prebuild outside of QEMU emulator
      run: sudo npm i -g npm@7 && npm install && rsync -a --info=progress2 src/ prebuild-src --exclude node_modules && node prebuild-minify.js && rm -rf node_modules
    - name: Build for arm32v7 (aka armv7l)
      uses: docker://arm32v7/node:14-buster
      with:
        args: bash -c "npm i -g npm@7 && npm config set fetch-retries 5 && npm config set fetch-retry-mintimeout 20000 && npm config set fetch-timeout 600000 && for i in 1 2 3; do npm install && break; echo 'npm install failed (attempt '$i'), retrying...'; sleep 15; done && for i in 1 2 3; do ./node_modules/.bin/electron-builder build -l --armv7l --publish ${{ env.PUBLISH_POLICY }} -c.publish.provider=github -c.publish.releaseType=release && break; echo 'build failed (attempt '$i'), retrying...'; sleep 15; done"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/upload-artifact@v4
      with:
        name: Linux-arm32-AppImage
        path: dist/*.AppImage
        if-no-files-found: error

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup QEMU
      uses: docker/setup-qemu-action@v1
      with:
        platforms: arm64
    - name: Cache node modules
      uses: actions/cache@v4
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Cache Electron binaries
      uses: actions/cache@v4
      env:
        cache-name: cache-electron-bins
      with:
        # cache location is described here:
        # https://github.com/electron/get#how-it-works
        path: ~/.cache/electron
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Run prebuild outside of QEMU emulator
      run: sudo npm i -g npm@7 && npm install && rsync -a --info=progress2 src/ prebuild-src --exclude node_modules && node prebuild-minify.js && rm -rf node_modules
    - name: Build for arm64 (aka arm64v8)
      uses: docker://arm64v8/node:14-buster
      with:
        args: bash -c "npm i -g npm@7 && npm config set fetch-retries 5 && npm config set fetch-retry-mintimeout 20000 && npm config set fetch-timeout 600000 && for i in 1 2 3; do npm install && break; echo 'npm install failed (attempt '$i'), retrying...'; sleep 15; done && for i in 1 2 3; do ./node_modules/.bin/electron-builder build -l --arm64 --publish ${{ env.PUBLISH_POLICY }} -c.publish.provider=github -c.publish.releaseType=release && break; echo 'build failed (attempt '$i'), retrying...'; sleep 15; done"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/upload-artifact@v4
      with:
        name: Linux-arm64-AppImage
        path: dist/*.AppImage
        if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - name: Get npm cache directory
      id: npm-cache
      shell: bash
      run: |
        echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: ${{ steps.npm-cache.outputs.dir }}
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
    - name: Cache Electron binaries
      uses: actions/cache@v4
      env:
        cache-name: cache-electron-bins
      with:
        # cache location is described here:
        # https://github.com/electron/get#how-it-works
        path: ~/AppData/Local/electron/Cache
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 14
    - name: Setup npm
      run: npm i -g npm@7
    - name: Work around missing openssl_fips gyp var in old Electron headers
      shell: bash
      run: npm config set openssl_fips "" --global
    - name: Setup Python build deps
      shell: bash
      run: python -m pip install setuptools
    - name: Replace bundled node-gyp (VS2022 detection bug)
      shell: bash
      run: |
        NPM_GYP_DIR="$(npm root -g)/npm/node_modules/node-gyp"
        mkdir -p "$RUNNER_TEMP/gyp-replacement"
        cd "$RUNNER_TEMP/gyp-replacement"
        npm init -y --silent
        npm install node-gyp@9 --silent
        # npm hoists node-gyp's own deps up to the top-level node_modules
        # instead of nesting them under node_modules/node-gyp - merge them
        # back in so the copied folder is fully self-contained.
        cd node_modules
        for d in */; do
          d="${d%/}"
          [ "$d" = "node-gyp" ] && continue
          mkdir -p "node-gyp/node_modules"
          cp -r "$d" "node-gyp/node_modules/"
        done
        rm -rf "$NPM_GYP_DIR"
        cp -r node-gyp "$NPM_GYP_DIR"
        node "$NPM_GYP_DIR/bin/node-gyp.js" --version
    - name: npm install
      shell: bash
      run: |
        for i in 1 2 3; do
          npm install && break
          echo "npm install failed (attempt $i), retrying..."
          sleep 10
        done
    - name: npm build
      shell: bash
      run: node_modules/.bin/electron-builder build -w --publish ${{ env.PUBLISH_POLICY }} -c.publish.provider=github -c.publish.releaseType=release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/upload-artifact@v4
      with:
        name: Windows-Installer
        path: dist/*.exe
        if-no-files-found: error

  build-darwin:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Cache node modules
      uses: actions/cache@v4
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Cache Electron binaries
      uses: actions/cache@v4
      env:
        cache-name: cache-electron-bins
      with:
        # cache location is described here:
        # https://github.com/electron/get#how-it-works
        path: ~/Library/Caches/electron
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
    - name: Setup npm
      run: sudo npm i -g npm@7 && sudo chown -R $(id -u):$(id -g) ~/.npm
    - name: Work around missing openssl_fips gyp var in old Electron headers
      run: npm config set openssl_fips "" --global
    - name: Setup Python build deps
      run: pip3 install --break-system-packages setuptools
    - name: Replace bundled node-gyp (old gyp bugs on modern Python/Electron headers)
      run: |
        NPM_GYP_DIR="$(sudo npm root -g)/npm/node_modules/node-gyp"
        mkdir -p /tmp/gyp-replacement
        cd /tmp/gyp-replacement
        npm init -y --silent
        npm install node-gyp@9 --silent
        cd node_modules
        for d in */; do
          d="${d%/}"
          [ "$d" = "node-gyp" ] && continue
          mkdir -p "node-gyp/node_modules"
          cp -r "$d" "node-gyp/node_modules/"
        done
        sudo rm -rf "$NPM_GYP_DIR"
        sudo cp -r node-gyp "$NPM_GYP_DIR"
        node "$NPM_GYP_DIR/bin/node-gyp.js" --version
    - name: npm install
      run: npm install
    - name: Disable Spotlight indexing (mitigates flaky "hdiutil ... Resource busy" dmg failures)
      run: sudo mdutil -a -i off
    - name: npm build
      run: |
        for i in 1 2 3; do
          ./node_modules/.bin/electron-builder build -m --publish ${{ env.PUBLISH_POLICY }} -c.publish.provider=github -c.publish.releaseType=release && break
          echo "build failed (attempt $i), retrying..."
          sleep 15
        done
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/upload-artifact@v4
      with:
        name: MacOS-Image
        path: dist/*.dmg
        if-no-files-found: error
